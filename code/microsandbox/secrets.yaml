OPENCODE_API_KEY:
  value: "${OPENCODE_API_KEY}"
  allow: ["opencode.ai"]
  substitution:
    headers: true
    header_fields: ["authorization", "x-api-key"]
    query: false
    body: false
GITHUB_TOKEN:
  value: "${GITHUB_TOKEN}"
  allow: ["api.github.com"]
  substitution:
    headers: true
    header_fields: ["authorization"]
    query: false
    body: false
  passthrough: ["opencode.ai"]
